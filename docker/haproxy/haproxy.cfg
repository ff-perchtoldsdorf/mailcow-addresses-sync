global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 10m
    timeout server 10m

frontend ft_smtps
    bind *:465
    default_backend bk_smtps

frontend ft_submission
    bind *:587
    default_backend bk_submission

frontend ft_imaps
    bind *:993
    default_backend bk_imaps

frontend ft_pop3s
    bind *:995
    default_backend bk_pop3s

frontend ft_sieve
    bind *:4190
    default_backend bk_sieve

frontend ft_https
    bind *:443
    default_backend bk_https

frontend ft_http
    bind *:80
    default_backend bk_http

backend bk_smtps
    server mailcow "${MAILCOW_IP}:465"

backend bk_submission
    server mailcow "${MAILCOW_IP}:587"

backend bk_imaps
    server mailcow "${MAILCOW_IP}:993"

backend bk_pop3s
    server mailcow "${MAILCOW_IP}:995"

backend bk_sieve
    server mailcow "${MAILCOW_IP}:4190"

backend bk_https
    server mailcow "${MAILCOW_IP}:443" send-proxy-v2

backend bk_http
    server mailcow "${MAILCOW_IP}:80" send-proxy-v2
