services:
  sync:
    image: ghcr.io/ff-perchtoldsdorf/mailcow-addresses-sync:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./postfix/data:/var/lib/postfix-sync

  haproxy:
    image: haproxy:3.0
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    network_mode: host
    environment:
      MAILCOW_IP: ${MAILCOW_IP:?Set MAILCOW_IP in docker/.env}
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  postfix:
    build: ./postfix
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./postfix/main.cf:/etc/postfix/main.cf:ro
      - ./postfix/data:/var/lib/postfix-sync
      - postfix-queue:/var/spool/postfix

volumes:
  postfix-queue:
